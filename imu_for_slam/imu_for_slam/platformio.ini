; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = genericSTM32F103C8

[env:genericSTM32F103C8]
platform = ststm32@20.0.0
board = genericSTM32F103C8
framework = stm32cube
upload_protocol = stlink
monitor_speed = 460800
extra_scripts = pre:scripts/freertos_build.py
board_build.f_cpu = 72000000L
board_build.stm32cube.custom_config_header = yes
; CMSIS startup/SystemInit is supplied by PlatformIO; main configures RCC.
board_build.stm32cube.custom_system_setup = no
build_flags =
    -DHSE_VALUE=8000000U
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter
    -O2

[env:genericSTM32F103C8_hsi]
extends = env:genericSTM32F103C8
board_build.f_cpu = 64000000L
build_flags =
    -DHSE_VALUE=8000000U
    -DAPP_FORCE_HSI=1
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter
    -O2

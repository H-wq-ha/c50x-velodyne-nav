# VLP-16 + STM32/MPU6500 hardware-stamped frontend.
# Use only planar driving on flat ground at constant sensor heights.
# Current IMU chip-center height is 0.01 m, confirmed by the user.
# LiDAR floor distance is estimated automatically from visible flat ground.
# No measured LiDAR height or LiDAR-to-IMU distance is required in auto mode.
# For upright VLP16 only, measurement origin = measured base height + 0.0377 m.
# PointCloud2 time is float32 seconds relative to header; zero is a valid first-point time.
# Local Velodyne preprocessing accepts a valid first-point time of zero.
# Do not pre-apply the OA time offset: GRIL estimates temporal offset itself.
# Use with the independently built gril_calibration entry point.
/**:
  ros__parameters:
    common:
      lid_topic: /calibration/velodyne_points
      imu_topic: /calibration/imu
      reliable_input: true
      hardware_time_sync: true
    preprocess:
      lidar_type: 2
      scan_line: 16
      blind: 0.5
      feature_extract_en: false
    ground:
      auto_height: true
    calibration:
      imu_frequency: 200
      cut_frame: true
      cut_frame_num: 3
      orig_odom_freq: 10
      mean_acc_norm: 9.80665
      imu_sensor_height: 0.01
      verbose: true
      data_accum_length: 300.0
      planar_motion: true
      min_planar_seconds: 90.0
      x_accumulate: 0.01
      y_accumulate: 0.01
      z_accumulate: 0.99
      trans_IL_x: 0.0
      trans_IL_y: 0.0
      trans_IL_z: 0.0
      set_boundary: false
      bound_th: 0.3
      gyro_factor: 10.0
      acc_factor: 1.0
      ground_factor: 5.0
    mapping:
      filter_size_surf: 0.5
      filter_size_map: 0.5
      gyr_cov: 0.5
      acc_cov: 0.5
      det_range: 200.0
      grav_cov: 0.0001
      b_gyr_cov: 0.0001
      b_acc_cov: 0.0001
      ground_cov: 500.0
    publish:
      path_en: true
      scan_publish_en: true
      dense_publish_en: false
      scan_bodyframe_pub_en: true
    pcd_save:
      pcd_save_en: false
      interval: -1
    trajectory_save:
      traj_save_en: false
      traj_file_path: /home/y/arm_car/lidar/tool/GRIL-Calib/result/traj_current.txt
    patchworkpp:
      sensor_height: 0.0
      mode: czm
      verbose: false
      visualize: false
      num_iter: 3
      num_lpr: 20
      num_min_pts: 10
      th_seeds: 0.3
      th_dist: 0.125
      th_seeds_v: 0.25
      th_dist_v: 0.1
      max_r: 20.0
      min_r: 1.0
      uprightness_thr: 0.707
      adaptive_seed_selection_margin: -1.2
      czm:
        num_zones: 4
        num_sectors_each_zone:
        - 16
        - 32
        - 54
        - 32
        num_rings_each_zone:
        - 2
        - 4
        - 4
        - 4
        elevation_thresholds:
        - 0.1
        - 0.2
        - 0.4
        - 0.6
        flatness_thresholds:
        - 0.0
        - 0.0
        - 0.0
        - 0.0
      enable_RNR: true
      enable_RVPF: true
      enable_TGR: true
      RNR_ver_angle_thr: -15.0
      RNR_intensity_thr: 0.2
